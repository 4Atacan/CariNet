services:
  postgres:
    image: postgres:16-alpine
    container_name: carinet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carinet
      POSTGRES_PASSWORD: carinet
      POSTGRES_DB: carinet
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carinet -d carinet']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: carinet-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  minio:
    image: minio/minio:latest
    container_name: carinet-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: carinet
      MINIO_ROOT_PASSWORD: carinet123
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 carinet carinet123 &&
      mc mb --ignore-existing local/carinet &&
      mc anonymous set none local/carinet &&
      echo 'bucket carinet hazir (private)'
      "

volumes:
  postgres-data:
  minio-data:
