# API ve panel imajlarini derleyip GitHub Container Registry'ye gonderir.
# Derleme neden burada: uretim sunucusu 954 MB RAM (Oracle Always Free) — Next derlemesi
# tek basina bunun katini istiyor, sunucuda derlenemez.
name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: apps/api/Dockerfile
          - app: panel
            context: apps/panel/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Registry girisi
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derle ve gonder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.context }}
          push: true
          # Panelde API adresi derleme aninda gomulur; ayni kokenden servis edildigi
          # icin /v1 yeterli (Caddy /v1'i API'ye yonlendirir) → CORS ve SameSite derdi yok.
          build-args: |
            NEXT_PUBLIC_API_URL=/v1
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/carinet-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/carinet-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
